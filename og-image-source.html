<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<title>OG image source — Ordinary Agency</title>
<!--
  Source for og-image.png (1200×630). Not linked from the site; it exists so
  the card can be regenerated when the brand moves. Mirrors the real hero —
  same paper, same ink, same green, same type.

  Regenerate:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --virtual-time-budget=6000 --screenshot=og-image.png \
      --window-size=1200,630 og-image-source.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FAFAF7;
    --ink: #15150F;
    --muted: #66645B;
    --accent: #2C7A57;
    --font-logo: "Fraunces", Georgia, serif;
    --font-display: "Space Grotesk", sans-serif;
    --font-sans: "Inter", sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--paper);
    font-family: var(--font-sans);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 68px 80px;
  }

  /* The hero's two glows, scaled to the card. */
  body::before, body::after {
    content: ""; position: absolute; z-index: 0;
    border-radius: 50%; filter: blur(36px);
  }
  body::before {
    top: -32%; right: -8%; width: 700px; height: 700px;
    background: radial-gradient(circle at center, rgba(44,122,87,0.30), rgba(44,122,87,0) 66%);
  }
  body::after {
    bottom: -38%; left: -12%; width: 540px; height: 540px;
    background: radial-gradient(circle at center, rgba(37,99,235,0.16), rgba(37,99,235,0) 66%);
  }

  .row { position: relative; z-index: 1; }

  .wordmark {
    font-family: var(--font-logo);
    font-size: 38px; font-weight: 600; letter-spacing: -0.02em;
    display: flex; align-items: baseline; gap: 10px;
  }
  .wordmark__mark { color: var(--accent); }
  .wordmark__sub {
    font-family: var(--font-sans); font-size: 14px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  }

  .title {
    font-family: var(--font-display);
    font-size: 124px; font-weight: 500; line-height: 0.94;
    letter-spacing: -0.045em;
  }
  .title em { font-style: normal; color: var(--accent); }

  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .foot p { font-size: 24px; line-height: 1.45; color: var(--muted); max-width: 32ch; }
  .eyebrow {
    font-size: 14px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent);
    display: flex; align-items: center; gap: 11px; white-space: nowrap;
  }
  .eyebrow::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="row wordmark">
    <span>Ordinary<span class="wordmark__mark">.</span></span>
    <span class="wordmark__sub">Agency</span>
  </div>

  <div class="row">
    <h1 class="title">Elevating the<br /><em>ordinary</em>.</h1>
  </div>

  <div class="row foot">
    <p>Websites, lead generation and automation for small business.</p>
    <span class="eyebrow">Digital marketing · Perth</span>
  </div>
</body>
</html>
